<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nextcare — Offline</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
     background:linear-gradient(135deg,#0055CC,#003399 55%,#001F66);
     min-height:100vh;display:flex;align-items:center;justify-content:center;
     color:#fff;padding:20px}
.card{background:rgba(255,255,255,.1);backdrop-filter:blur(20px);
      border:1px solid rgba(255,255,255,.2);border-radius:20px;
      padding:40px 32px;text-align:center;max-width:380px;width:100%}
.icon{font-size:64px;margin-bottom:20px}
h1{font-size:24px;font-weight:700;margin-bottom:8px}
p{font-size:14px;opacity:.8;line-height:1.7;margin-bottom:20px}
.btn{display:inline-block;padding:12px 28px;background:#fff;color:#0055CC;
     border-radius:999px;font-weight:700;font-size:14px;cursor:pointer;
     border:none;font-family:inherit;text-decoration:none;transition:opacity .2s}
.btn:hover{opacity:.9}
.sub{font-size:12px;opacity:.6;margin-top:16px}
</style>
</head>
<body>
<div class="card">
  <div class="icon">📶</div>
  <h1>أنت غير متصل بالإنترنت</h1>
  <p>
    You're offline. Please check your internet connection and try again.<br><br>
    تحقق من اتصالك بالإنترنت وحاول مرة أخرى.
  </p>
  <button class="btn" onclick="window.location.reload()">🔄 Try Again</button>
  <div class="sub">Nextcare Medical Care · نظام تبادل الشيفتات</div>
</div>
<script>
window.addEventListener('online', () => window.location.reload());
</script>
</body>
</html>
